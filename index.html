<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Company Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-header">
        <h1><i class="fas fa-building"></i> Company Manager</h1>
    </header>

    <div class="container">
        <div class="toolbar">
            <div class="filters">
                <input type="text" id="filterSearch" placeholder="Търси по пълно име (I)...">
                <select id="filterDept">
                    <option value="">Всички отдели</option>
                </select>
                <div class="salary-range">
                    <input type="number" id="filterMinSal" placeholder="Заплата от...">
                    <span>-</span>
                    <input type="number" id="filterMaxSal" placeholder="Заплата до...">
                </div>
                <select id="filterTown">
                    <option value="">Всички градове</option>
                </select>
            </div>
            <div class="actions">
                <button id="btnClear" class="btn btn-secondary"><i class="fas fa-eraser"></i> Clear</button>
                <button id="btnExcel" class="btn btn-success"><i class="fas fa-file-excel"></i> Excel</button>
                <button id="btnAdd" class="btn btn-primary"><i class="fas fa-plus"></i> Add Employee</button>
            </div>
        </div>

        <div class="table-container">
            <table id="dataTable" class="table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th class="sortable" data-sort="full_name">Пълно име <i class="fas fa-sort"></i></th>
                        <th class="sortable" data-sort="job_title">Длъжност <i class="fas fa-sort"></i></th>
                        <th>Отдел (Department)</th>
                        <th class="sortable" data-sort="salary">Заплата <i class="fas fa-sort"></i></th>
                        <th class="sortable" data-sort="address_text">Адрес <i class="fas fa-sort"></i></th>
                        <th>Град</th>
                        <th>Редакция</th>
                        <th>Изтриване</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>

        <div class="pagination-container">
            <div class="pagination">
                <button id="btnPrev" class="btn-page"><i class="fas fa-chevron-left"></i></button>
                <div id="pageNumbers" class="page-numbers">
                    </div>
                <button id="btnNext" class="btn-page"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div id="pageInfoText" class="page-info-text">Показани 0-0 от 0</div>
        </div>
    </div>

    <div id="formModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Добави служител</h2>
                <span class="close-modal" id="closeFormModal">&times;</span>
            </div>
            <form id="empForm">
                <input type="hidden" id="empId">
                <div class="form-grid">
                    <div class="input-group">
                        <label>Име</label>
                        <input type="text" id="empFirst" required>
                    </div>
                    <div class="input-group">
                        <label>Фамилия</label>
                        <input type="text" id="empLast" required>
                    </div>
                    <div class="input-group">
                        <label>Длъжност</label>
                        <input type="text" id="empJob" required>
                    </div>
                    <div class="input-group">
                        <label>Заплата</label>
                        <input type="number" step="0.01" id="empSalary" required>
                    </div>
                    <div class="input-group">
                        <label>Отдел</label>
                        <select id="empDept" required></select>
                    </div>
                    <div class="input-group full-width">
                        <label>Адрес</label>
                        <select id="empAddress" required></select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-full" style="margin-top: 20px;">Запази</button>
            </form>
        </div>
    </div>

    <div id="delModal" class="modal">
        <div class="modal-content small-modal">
            <h2>Внимание!</h2>
            <p style="margin: 15px 0;">Сигурни ли сте, че искате да изтриете този запис?</p>
            <input type="hidden" id="delId">
            <div class="modal-actions">
                <button id="confirmDel" class="btn btn-danger">Да, изтрий</button>
                <button id="cancelDel" class="btn btn-secondary">Отказ</button>
            </div>
        </div>
    </div>

    <div id="msgBox" class="msg-box">
        <span id="msgText">Успешно!</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
